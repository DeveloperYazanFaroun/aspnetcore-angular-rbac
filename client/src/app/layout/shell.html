<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-3">
    <nav class="flex items-center gap-1 text-sm font-medium">
      <a routerLink="/" class="mr-4 text-base font-semibold text-indigo-700">RBAC Reference</a>
      <!-- Each link appears only when the user has the matching permission. -->
      <a *appHasPermission="P.Invoices.View" routerLink="/invoices" routerLinkActive="bg-slate-100"
         class="rounded-lg px-3 py-2 text-slate-700 hover:bg-slate-50">Invoices</a>
      <a *appHasPermission="P.Users.View" routerLink="/users" routerLinkActive="bg-slate-100"
         class="rounded-lg px-3 py-2 text-slate-700 hover:bg-slate-50">Users</a>
      <a *appHasPermission="P.Roles.View" routerLink="/roles" routerLinkActive="bg-slate-100"
         class="rounded-lg px-3 py-2 text-slate-700 hover:bg-slate-50">Roles</a>
    </nav>

    @if (auth.user(); as user) {
      <div class="flex items-center gap-3 text-sm">
        <div class="text-right">
          <div class="font-medium">{{ user.fullName }}</div>
          <div class="text-xs text-slate-500">{{ user.tenantName }} · {{ user.roles.join(', ') }}</div>
        </div>
        <button type="button" class="btn btn-secondary" (click)="auth.logout()">Sign out</button>
      </div>
    }
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-8">
  <router-outlet />
</main>
