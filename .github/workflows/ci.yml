name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Rbac.slnx
      - run: dotnet build Rbac.slnx --no-restore --configuration Release
      - run: dotnet test Rbac.slnx --no-build --configuration Release --verbosity normal

  client:
    name: Client (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
